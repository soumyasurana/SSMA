name: ssma
description: "Surana App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shared_preferences: ^2.2.2
  uuid: ^4.5.2
  http: ^1.2.2
  fl_chart: ^0.68.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4       # Route builder for LocalSyncServer
  crypto: ^3.0.3             # SHA-256 for change chain hashes
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  path_provider: ^2.1.1
  pdf: ^3.10.7
  printing: ^5.11.0
  file_picker: ^8.1.6
  open_filex: ^4.1.3
  isar_community: ^3.2.0
  isar_community_flutter_libs: ^3.2.0
  excel: ^2.1.0
  nsd: ^5.0.0

dev_dependencies:
  mocktail: ^1.0.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.8
  isar_community_generator: ^3.2.0
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/logo_app.png"
  image_path: "assets/logo_app.png"



flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/logo_app.png
